<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - Academic Agent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body
  style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #0b0f17; color: #f8fafc; padding: 20px;">
  <div
    style="max-width: 520px; width: 100%; background: #111827; border: 1px solid #1f293d; border-radius: 4px; padding: 36px; text-align: center;">

    <div
      style="font-family: monospace; font-size: 56px; font-weight: 800; color: #3b82f6; letter-spacing: 2px; margin-bottom: 12px;">
      404</div>
    <h1 style="font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 12px;">Requested Resource Not Found</h1>
    <p style="font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px;">
      The URL or endpoint you attempted to access does not exist on this Academic Agent instance.
      Check the path or return to your academic dashboard.
    </p>

    <div style="display: flex; justify-content: center; gap: 12px;">
      <a href="/" class="btn btn-primary" style="text-decoration: none;">Return to Dashboard</a>
      <a href="/privacy" class="btn btn-secondary" style="text-decoration: none;">Privacy Policy</a>
    </div>

    <div
      style="margin-top: 28px; padding-top: 16px; border-top: 1px solid #1f293d; font-size: 12px; color: #64748b; font-family: monospace;">
      STATUS: HTTP 404 NOT FOUND | ACADEMIC AGENT CORE
    </div>
  </div>
</body>

</html>
