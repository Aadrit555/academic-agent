<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Agent - Student Work Review</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <div class="addon-container">
    <header class="addon-header">
      <div class="header-brand">
        <div class="brand-logo">AA</div>
        <div class="brand-text">
          <div class="brand-title">
            <span>ACADEMIC AGENT</span>
            <span class="brand-badge">WORK REVIEW</span>
          </div>
          <span class="brand-sub">Submission &amp; Compiler Verification Review</span>
        </div>
      </div>
    </header>

    <section class="addon-section">
      <div class="section-label">SUBMISSION REVIEW</div>
      <div id="review-content">
        <div class="loading-compact">
          <span class="spinner-dot"></span>
          <span>Loading verified submission deliverables...</span>
        </div>
      </div>
    </section>

    <footer class="addon-footer">
      <div class="footer-copy">Academic Agent Compiler Verification • Google Classroom Native</div>
    </footer>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("itemId") || params.get("courseWorkId");

    async function loadReview() {
      const container = document.getElementById("review-content");
      if (!itemId) {
        container.innerHTML = '<div class="empty-compact">No assignment item identifier specified in review context.</div>';
        return;
      }

      try {
        const token = localStorage.getItem("academic_agent_jwt");
        const headers = token ? { "Authorization": `Bearer ${token}` } : {};

        // Fetch coursework list and locate matching item
        const cws = await fetch("/api/classroom/coursework", { headers }).then(r => r.json()).catch(() => []);
        const matched = cws.find(c => String(c.id) === String(itemId) || String(c.coursework_id) === String(itemId));

        if (!matched) {
          container.innerHTML = '<div class="empty-compact">Assignment submission record not found or not yet executed.</div>';
          return;
        }

        const [deliv, val] = await Promise.all([
          fetch(`/api/assignment/${matched.id}/deliverable`, { headers }).then(r => r.ok ? r.json() : null).catch(() => null),
          fetch(`/api/assignment/${matched.id}/validate`, { headers }).then(r => r.ok ? r.json() : null).catch(() => null)
        ]);

        if (!deliv) {
          container.innerHTML = '<div class="empty-compact">No deliverable files generated for this submission.</div>';
          return;
        }

        const attachmentId = params.get("attachmentId") || "";
        const submissionId = params.get("submissionId") || "";
        const courseId = params.get("courseId") || (matched ? matched.classroom_course_id : "");

        const maxPoints = matched && matched.max_points ? matched.max_points : 100;
        const suggestedGrade = val && val.passed ? maxPoints : Math.round(maxPoints * 0.7);

        container.innerHTML = `
          <div class="deliv-card">
            <div class="deliv-header">
              <div class="deliv-name">
                <span class="file-ext">${escapeHtml(deliv.file_type || '.c')}</span>
                <b>${escapeHtml(deliv.file_name)}</b>
              </div>
              <span class="status-pill status-${val && val.passed ? 'completed' : 'not_started'}">
                ${val && val.passed ? 'VERIFIED' : 'PENDING'}
              </span>
            </div>

            <div class="code-preview-wrap">
              <pre class="code-preview"><code>${escapeHtml(deliv.code_or_content || '')}</code></pre>
            </div>

            ${checklist.length > 0 ? `
              <div class="val-checklist">
                <div class="val-title">COMPILER VALIDATION CHECKLIST:</div>
                ${checklist.map(c => `
                  <div class="check-item ${c.passed ? 'check-pass' : 'check-fail'}">
                    <span>${c.passed ? '✓' : '✗'}</span>
                    <span class="check-text">${escapeHtml(c.title)}: ${escapeHtml(c.details || '')}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <div class="grade-passback-box" style="margin-top: 16px; padding: 14px; background: var(--bg-tertiary, #0f172a); border-radius: 8px; border: 1px solid var(--border, #334155);">
              <div style="font-weight: 600; font-size: 13px; color: var(--text-primary, #f8fafc); margin-bottom: 8px;">
                GRADE PASSBACK TO GOOGLE CLASSROOM (Discovery API v1)
              </div>
              <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <label style="font-size: 12px; color: var(--text-secondary, #94a3b8);">Points:</label>
                <input type="number" id="grade-input" value="${suggestedGrade}" min="0" max="${maxPoints}" step="1" 
                  style="width: 80px; padding: 6px 8px; background: var(--bg-secondary, #1e293b); color: #fff; border: 1px solid var(--border, #475569); border-radius: 6px;">
                <span style="font-size: 12px; color: var(--text-secondary, #94a3b8);">/ ${maxPoints} max</span>
                <button class="btn btn-primary btn-sm" id="btn-passback" onclick="submitGradePassback('${escapeHtml(courseId)}', '${escapeHtml(matched.coursework_id || itemId)}', '${escapeHtml(attachmentId)}', '${escapeHtml(submissionId)}')">
                  Pass Back Grade
                </button>
              </div>
              <div id="grade-status" style="margin-top: 8px; font-size: 12px; display: none;"></div>
            </div>
          </div>
        `;
      } catch (e) {
        container.innerHTML = `<div class="empty-compact text-danger">Failed to load submission review: ${escapeHtml(e.message)}</div>`;
      }
    }

    async function submitGradePassback(courseId, itemId, attachmentId, submissionId) {
      const btn = document.getElementById("btn-passback");
      const statusEl = document.getElementById("grade-status");
      const gradeInput = document.getElementById("grade-input");
      const points = parseFloat(gradeInput.value);

      if (isNaN(points)) {
        alert("Please enter a valid numeric grade.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Passing back...";
      statusEl.style.display = "block";
      statusEl.style.color = "#94a3b8";
      statusEl.textContent = "Sending grade passback to Google Classroom API...";

      try {
        const token = localStorage.getItem("academic_agent_jwt");
        const headers = { "Content-Type": "application/json" };
        if (token) headers["Authorization"] = `Bearer ${token}`;

        const res = await fetch("/api/classroom/grade-passback", {
          method: "POST",
          headers: headers,
          body: JSON.stringify({
            course_id: courseId || "classroom_course",
            item_id: itemId,
            attachment_id: attachmentId || "attachment_1",
            submission_id: submissionId || "me",
            points_earned: points
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: "Grade passback failed." }));
          throw new Error(err.detail || "Classroom API rejected grade passback.");
        }

        statusEl.style.color = "#10b981";
        statusEl.textContent = `✓ Grade of ${points} passed back to Google Classroom successfully.`;
        btn.textContent = "✓ Grade Saved";
      } catch (e) {
        statusEl.style.color = "#ef4444";
        statusEl.textContent = `Passback Note: ${e.message} (Ensure Google account is connected with teacher permissions).`;
        btn.disabled = false;
        btn.textContent = "Retry Passback";
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.addEventListener("DOMContentLoaded", loadReview);
  </script>
</body>

</html>
