<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Academic Agent — Google Classroom Plugin</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge {
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }
    .status-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #94a3b8;
    }
    .val {
      font-weight: 600;
      color: #f1f5f9;
    }
    .val-connected {
      color: #34d399;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 8px;
      transition: background 0.15s ease;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .autopilot-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      border-radius: 20px;
      transition: .2s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: .2s;
    }
    input:checked + .slider {
      background-color: #10b981;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>⚡ ACADEMIC AGENT</span>
      <span class="badge">CLASSROOM PLUGIN</span>
    </div>
  </div>

  <div class="status-card">
    <div class="row">
      <span class="label">Google Account:</span>
      <span class="val val-connected" id="status-account">aadrit_y@srmap.edu.in</span>
    </div>
    <div class="row">
      <span class="label">Next Class:</span>
      <span class="val" id="status-next-class">Loading...</span>
    </div>
    <div class="row">
      <span class="label">Current Task:</span>
      <span class="val" id="status-active-work">Auto-Detecting...</span>
    </div>
  </div>

  <div class="autopilot-box">
    <div>
      <b style="color: #34d399; display: block;">⚡ Zero-Touch Auto-Submit</b>
      <span style="color: #94a3b8;">Direct submit without download</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="autopilot-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button class="btn btn-primary" id="btn-popup-submit">
    ⚡ Auto-Submit Current Coursework
  </button>

  <a class="btn btn-secondary" href="http://127.0.0.1:8000/addon" target="_blank">
    Open Companion Web Layer ↗
  </a>

  <div class="footer">Zero-Download Direct Classroom Submission • Active</div>

  <script src="popup.js"></script>
</body>
</html>
